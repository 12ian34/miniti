name: tests

on:
  push:
    branches: [main, ci]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  macos:
    name: macOS tests
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache the Nemotron model (fetched by the build phase, 190 MB)
        uses: actions/cache@v4
        with:
          path: Miniti/Resources/NemotronDiarizer
          key: nemotron-${{ hashFiles('scripts/fetch-nemotron-model.sh') }}

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Miniti.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Xcode version
        run: xcodebuild -version

      - name: Run MinitiTests
        run: |
          set -o pipefail
          run_tests() {
            xcodebuild test \
              -project Miniti.xcodeproj \
              -scheme Miniti \
              -destination 'platform=macOS' \
              -derivedDataPath DerivedData \
              -only-testing:MinitiTests \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
              2>&1 | tee macos-tests.log | (grep -E 'Test Suite|Test Case.*(passed|failed)|error:|Executed|BUILD|TEST' || true)
          }
          # The runner's swift-frontend (Swift 6.3.3) crashes now and then in its SendNonSendable
          # pass on the sync engine's commit closures; the local Xcode 27.1 never does. A crash
          # leaves "Stack dump" in the log and is retried once. A failing test or a real compile
          # error has no stack dump and fails here at once.
          if ! run_tests; then
            if grep -q "Stack dump" macos-tests.log; then
              echo "::warning::swift-frontend crashed (runner toolchain); retrying once"
              run_tests
            else
              false
            fi
          fi
          # pipefail above makes xcodebuild's own exit status decide (a compiler crash or a failed
          # test fails the step); the gate below reads the bundle total, the last "Executed" line,
          # not any one suite's line. The old gate matched a suite with 0 failures while the bundle
          # had 15 (2026-10-19 run), and the step passed.
          grep -E 'Executed [0-9]+ tests' macos-tests.log | tail -1 | tee /dev/stderr | grep -qE 'with ([0-9]+ tests? skipped and )?0 failures \(0 unexpected\)'

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-tests-log
          path: macos-tests.log

  ios:
    name: iOS tests
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache the Nemotron model (fetched by the build phase, 190 MB)
        uses: actions/cache@v4
        with:
          path: Miniti/Resources/NemotronDiarizer
          key: nemotron-${{ hashFiles('scripts/fetch-nemotron-model.sh') }}

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Miniti.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Pick a simulator
        id: sim
        run: |
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          cands=[dev for rt,devs in d.items() if "iOS" in rt for dev in devs if dev["name"].startswith("iPhone")]
          cands.sort(key=lambda x: x["name"])
          print(cands[-1]["udid"] if cands else "")')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          test -n "$UDID"

      - name: Run MinitiMobileTests
        run: |
          set -o pipefail
          run_tests() {
            xcodebuild test \
              -project Miniti.xcodeproj \
              -scheme MinitiMobile \
              -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
              -derivedDataPath DerivedData \
              -only-testing:MinitiMobileTests \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
              2>&1 | tee ios-tests.log | (grep -E 'Test Suite|Test Case.*(passed|failed)|error:|Executed|BUILD|TEST' || true)
          }
          # The runner's swift-frontend (Swift 6.3.3) crashes now and then in its SendNonSendable
          # pass on the sync engine's commit closures; the local Xcode 27.1 never does. A crash
          # leaves "Stack dump" in the log and is retried once. A failing test or a real compile
          # error has no stack dump and fails here at once.
          if ! run_tests; then
            if grep -q "Stack dump" ios-tests.log; then
              echo "::warning::swift-frontend crashed (runner toolchain); retrying once"
              run_tests
            else
              false
            fi
          fi
          # pipefail above makes xcodebuild's own exit status decide (a compiler crash or a failed
          # test fails the step); the gate below reads the bundle total, the last "Executed" line,
          # not any one suite's line. The old gate matched a suite with 0 failures while the bundle
          # had 15 (2026-10-19 run), and the step passed.
          grep -E 'Executed [0-9]+ tests' ios-tests.log | tail -1 | tee /dev/stderr | grep -qE 'with ([0-9]+ tests? skipped and )?0 failures \(0 unexpected\)'

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-tests-log
          path: ios-tests.log
